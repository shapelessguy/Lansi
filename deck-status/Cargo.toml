[package]
name = "anki-deck-status"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
publish = false
rust-version.workspace = true
description = "Keeps a copy of a synced collection up to date and serves its contents as JSON"

[[bin]]
path = "src/main.rs"
name = "anki-deck-status"

[build-dependencies]
anki_io.workspace = true
anki_proto_gen.workspace = true
anyhow.workspace = true
inflections.workspace = true
prost-reflect.workspace = true

[dependencies]
anki_io.workspace = true
anki_proto.workspace = true
anyhow.workspace = true
axum.workspace = true
envy.workspace = true
prost.workspace = true
prost-reflect = { workspace = true, features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[target.'cfg(windows)'.dependencies]
anki = { workspace = true, features = ["native-tls"] }

[target.'cfg(not(windows))'.dependencies]
anki = { workspace = true, features = ["rustls"] }

[dev-dependencies]
tempfile.workspace = true
