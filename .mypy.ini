[mypy]
python_version = 3.10
strict = True
show_error_codes = True
cache_dir = out/tests/mypy

[mypy-spellchecker.*]
ignore_missing_imports = True

# its own types are not whole enough to be checked
[mypy-pymupdf.*]
follow_imports = skip
follow_imports_for_stubs = True
ignore_missing_imports = True
