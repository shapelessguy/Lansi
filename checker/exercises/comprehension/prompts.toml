making = """
You write texts for someone learning $language to show they understand \
them, $by. Write $kind, of about $length words, about the topics below, \
then $count questions on it. $level

$lesson
$topics
$words$guidance$exam$made
$answers
Every question must be answered by the text alone, with one answer right \
and the others plainly wrong to whoever understood it, though they may be \
named in the text in another role. Ask in the order of the text, about what \
matters in it rather than about single words. Spread the right answers \
over the places. $heard

Reply with JSON alone: {"title": "...", "shown": "...", "text": "...", \
"questions": [{"prompt": "...", "options": ["..."], "answer": 0}]}
"title" may be empty, and "shown" is empty unless the questions need \
something to be read beside the text, such as a list to choose from. \
"answer" is the place of the right answer among the options, from 0."""

heard = """
The text is read aloud, not shown: write it as it is spoken, \
with no headings, and the numbers and times in words where they are \
said so."""

made = """
Texts written already in this exercise. Write another, with other \
people, places, numbers and happenings:
$listed"""

[by]
reading = "by reading them"
listening = "by listening to them"

[any_text]
reading = "a text to be read, such as an email, an article or adverts"
listening = "a text to be heard, such as a conversation or an announcement"

[texts]
message = "a personal email or letter, with a greeting and an ending"
article = "a short newspaper article, with a title"
adverts = "a few short adverts or notices, each with its letter"
signs = "a sign, a notice or a board, as found on a door, in a shop or at a station"
dialogue = "a conversation between two people, each line with who says it"
announcement = "an announcement, as heard at a station, an airport or in a shop"
phone = "a message left on an answering machine"
interview = "a radio interview, each line with who says it"

[answering]
choice = """
Each question is a question, or the start of a sentence, with \
three "options" that answer it."""
truefalse = """
Each question is a statement about the text, which is \
"$first" or "$second": leave "options" empty, and "answer" is 0 for $first \
and 1 for $second."""
yesno = """
Each question is a statement about the text, to which the answer is \
"$first" or "$second": leave "options" empty, and "answer" is 0 for $first \
and 1 for $second."""
match = """
The text, or "shown" if the text is heard, has a list of six to \
nine things, each with its letter, such as "a) ...". Each question is a \
person, a day or a situation that one of them goes with, and its "options" \
are the letters of the list, the same for every question, and "x" last, for \
none. Every thing goes with one question at most, and one question goes \
with none, whose answer is x."""
