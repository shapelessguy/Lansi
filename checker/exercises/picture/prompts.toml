planning = """
You plan a picture for someone learning $language at level $level, who \
will mark on it the things they can name, and name them in $language.

$topics
$words$guidance
Choose $count different things that fit the topics: concrete objects, easy \
to see and to draw, whose names a learner at level $level knows or should \
learn.$avoid Then choose $panels scenes where they could be seen, each a \
particular place and moment, rather than the first that comes to mind for \
the topic, and each with a few of the things.

For each thing, say in English what it is, for the illustrator, such as "a \
red kettle". For each scene, say in English what it shows, in one sentence \
that leaves the things out.

Reply with JSON alone: {"scenes": ["A sunny kitchen seen from the door."], \
"things": ["a wooden kitchen table", "a red kettle"]}"""

judging = """
Someone learning $language at level $level marked things on this picture \
and named each in $language. Each mark is a red ring, with its number in a \
red circle beside it. After the picture comes a close-up of each mark, with \
the ring around what was marked. This is what they wrote for each:
$labels

Judge each in two steps.

First, find what they meant: the thing in the picture that what they \
wrote names, among those the ring is on, on a part of, or next to. A mark \
is rarely placed exactly, so a ring on an arm, a hand or a sleeve is on \
the person, a ring on a leg of a table is on the table, and a ring by the \
edge of a thing is on it. Only if what they wrote names nothing there, \
what they meant is what the ring is on. Say it in English as "meant".

Then judge only the $language of what they wrote, as a name of what they \
meant, never where the ring is:
- "right": a correct name of it, with the right article if $language has \
articles. A more general or a more particular name is right too, such as \
the name of the whole thing or of the part the ring is on. Where it is one \
of a group of the same things, the plural is right as well as the \
singular. A capital first letter does not matter.
- "partial": the right word with a small mistake, such as in its article, a \
missing article, its spelling, the marks on its letters or capitals; or a \
word so near in meaning that it is not quite the name of it.
- "wrong": not a name of anything the ring is on or next to.

For each, give also "correct": what was written if it is right, and \
otherwise the everyday name in $language of what they meant, as near to \
what was written as it can be, with its article if $language has \
articles; "alternatives": for one that is not right, up to three other \
words in $language for that very thing, as a synonym is, never things \
that are near it, parts of it or what it is in, or [] if there are none \
or it is right; "translation": its name in $into; "note": in $into, in a \
few words, what was not right in the $language, or "" if it was, never \
anything about where the ring is; and "hint": in $into, in a few words, \
only if the ring is mostly on something else than what they meant, what \
that is called in $language, as something more to learn, or "" otherwise.

Reply with JSON alone: {"labels": [{"n": 1, "meant": "a silver cup", \
"result": "partial", "correct": "...", "alternatives": ["..."], \
"translation": "trophy", "note": "That is the word for a prize, not for \
this cup.", "hint": ""}]}"""

