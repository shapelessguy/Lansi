<!doctype html>
<!-- the app translates itself, and a browser that translated it, or looked
     through its text for what language it is in, would only get in the way -->
<html lang="en" translate="no">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="google" content="notranslate" />
        <link rel="icon" type="image/svg+xml" href="/lansi.svg" />
        <!-- what the browser shows the app with once it is installed; asked for
             with the cookies, as the nginx of CyanHouse lets no one in without them -->
        <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <!-- the colour of the title bar, until the app sets that of the theme in use -->
        <meta name="theme-color" content="#1b1b1a" />
        <title>Lansi</title>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
